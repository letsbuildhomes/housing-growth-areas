'use strict';
let passed = 0, failed = 0;
function test(name, fn) {
  const row = document.createElement('li');
  try {fn(); passed++; row.className = 'pass'; row.textContent = 'PASS: ' + name;}
  catch (error) {failed++; row.className = 'fail'; row.textContent = 'FAIL: ' + name + ' — ' + error.message;}
  document.getElementById('results').append(row);
}
function canonical(value) {
  if (Array.isArray(value)) return value.map(canonical);
  if (value && typeof value === 'object') return Object.fromEntries(
    Object.keys(value).sort().map(key => [key, canonical(value[key])]));
  return value;
}
const assert = {
  equal(actual, expected) {
    if (!Object.is(actual, expected)) throw new Error(`Expected ${expected}; received ${actual}`);
  },
  deepEqual(actual, expected) {
    this.equal(JSON.stringify(canonical(actual)), JSON.stringify(canonical(expected)));
  },
};
const display = EligibilityDisplay;
test('desktop pinch batches transforms, preserves the cursor anchor, and redraws only on release', () => {
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;left:0;top:0;width:400px;height:300px;visibility:hidden';
  document.body.append(container);
  const map = L.map(container, {zoomAnimation:false, scrollWheelZoom:false, zoomSnap:.25,
    minZoom:6, maxZoom:19}).setView([44,-72.5],8);
  const polygon = L.polygon([[43.9,-72.6],[44.1,-72.6],[44.1,-72.4]]).addTo(map);
  let frame, timer, scheduled = 0, projections = 0;
  const project = polygon._project;
  polygon._project = function() { projections++; return project.call(this); };
  const controller = MapInteractions.trackpadZoom(map, {
    touchPoints:0, requestFrame:fn => {frame=fn; scheduled++; return scheduled;},
    cancelFrame:() => {frame=null;}, setTimer:fn => {timer=fn; return 1;}, clearTimer:() => {timer=null;},
  });
  const point = L.point(275,110);
  const anchor = map.containerPointToLatLng(point);
  const wheel = (deltaY, ctrlKey=true) => {
    const event = new WheelEvent('wheel', {clientX:point.x, clientY:point.y, deltaY, ctrlKey, cancelable:true});
    container.dispatchEvent(event); return event;
  };
  try {
    for (let i=0; i<8; i++) assert.equal(wheel(-1).defaultPrevented, true);
    assert.equal(scheduled,1);
    frame();
    assert.equal(Math.abs(map.getZoom()-(8+8/60)) < 1e-10, true);
    assert.equal(projections,0);
    assert.equal(map.latLngToContainerPoint(anchor).distanceTo(point) <= 1, true);
    timer();
    assert.equal(map.getZoom(),8.25);
    assert.equal(projections > 0,true);
    assert.equal(controller.isActive(),false);
    assert.equal(map.latLngToContainerPoint(anchor).distanceTo(point) <= 1,true);
    wheel(-1); frame();
    assert.equal(wheel(1,false).defaultPrevented,false);
    assert.equal(controller.isActive(),false);
    wheel(-100000); frame(); assert.equal(map.getZoom(),19); controller.finish();
    wheel(100000); frame(); assert.equal(map.getZoom(),6); controller.finish();
    const gesture = (type, scale=1) => {
      const event = new MouseEvent(type,{clientX:point.x,clientY:point.y,cancelable:true});
      Object.defineProperty(event,'scale',{value:scale}); container.dispatchEvent(event);
    };
    gesture('gesturestart'); gesture('gesturechange',1.1); frame();
    assert.equal(Math.abs(map.getZoom()-(6+Math.log2(1.1))) < 1e-10,true);
    const before = map.getZoom(); wheel(-10); assert.equal(map.getZoom(),before);
    gesture('gestureend'); assert.equal(map.getZoom(),6.25);
    wheel(-1); document.dispatchEvent(new Event('pointerdown'));
    assert.equal(controller.isActive(),false); assert.equal(frame,null);
    controller.finish();
  } finally {controller.destroy(); map.remove(); container.remove();}
});
test('touch devices leave native Safari pinch gestures untouched', () => {
  const container = document.createElement('div');
  const controller = MapInteractions.trackpadZoom({getContainer:()=>container}, {touchPoints:5});
  try {
    const event = new Event('gesturestart',{cancelable:true});
    container.dispatchEvent(event);
    assert.equal(event.defaultPrevented,false);
    assert.equal(controller.isActive(),false);
  } finally {controller.destroy();}
});
test('tap cards survive finger release while touch movement and mouse exit clear them', () => {
  const container = document.createElement('div');
  const map = new L.Evented();
  map.getContainer = () => container;
  let visible = false, followed = null;
  const hover = MapInteractions.pointerHover(map, event => {visible=true; followed=event;}, () => {visible=false;});
  const pointer = (type, pointerType) => container.dispatchEvent(new PointerEvent(type, {pointerType}));
  try {
    pointer('pointerdown','touch'); pointer('pointerup','touch'); pointer('pointerleave','touch');
    assert.equal(visible,false);
    const tap = new MouseEvent('click',{clientX:70,clientY:90});
    map.fire('click',{originalEvent:tap});
    pointer('pointerleave','touch');
    assert.equal(visible,true); assert.equal(followed,tap);
    pointer('pointerdown','touch'); pointer('pointermove','touch'); pointer('pointerup','touch');
    assert.equal(visible,false); // A drag has no Leaflet click.
    pointer('pointermove','mouse'); assert.equal(visible,true);
    pointer('pointerleave','mouse'); assert.equal(visible,false);
    map.fire('click',{originalEvent:tap}); window.dispatchEvent(new Event('blur'));
    assert.equal(visible,false);
  } finally {hover.destroy();}
});
const {compile, player, timing} = window.MapStoryAnimation;
test('active story has independent chapters and reversible polygon visibility', () => {
  const context = {housingData: {municipalities: []}, colors: {
    positive: '#112233', negative: '#445566', unknown: '#778899', partial: '#cf9a35',
    gain: '#399b55', neutral: '#e2e6e3', villageArea: '#bedde4', villageCenter: '#7bb6c5',
    plannedGrowth: '#38889f', downtown: '#15566b'}};
  const story = MapStories.create(context);
  assert.equal(story.steps.length, 4);
  const initial = ['area', 'tier', 'housing-category', 'housing-block', 'housing-coverage'].map(kind => ({kind,
    props: {flu_code: 'VA', coverage_kind: 'covered', coverage_status: 'substantial'},
    style: {color: '#112233', fillColor: '#112233', opacity: 0, fillOpacity: 0}}));
  initial.forEach(item => {item.style = {...item.style, ...story.initial(item)};});
  const timeline = compile(initial, story.groups);
  // Growth blocks stay invisible until hovered; Tier 1B appears only through
  // coverage pieces, with no separate outline layer.
  assert.deepEqual(timeline.sample(timeline.stops[3]).map(i => i.style.opacity), [0, 0, 0, 0, 0.95]);
  assert.deepEqual(timeline.sample(timeline.stops[2]).map(i => i.style.opacity), [0, 0, 0, 0, 0.95]);
  assert.deepEqual(timeline.sample(timeline.stops[1]).map(i => i.style.opacity), [0, 0, 0.75, 0, 0]);
  assert.deepEqual(timeline.sample(0).map(i => i.style.opacity), [0, 0, 0.95, 0, 0]);
  assert.equal(story.steps[0].areaKey.length, 4);
  assert.equal(story.steps[0].areaKey.some(entry => entry[2] === 'outline'), false);
  // Interim exemption areas belong to the act181 story and are never mounted here.
  assert.deepEqual(story.overlays, ['housing-category', 'housing-block', 'housing-coverage']);
  let rejected = false;
  try {MapStories.create(context, 'act181');} catch {rejected = true;}
  assert.equal(rejected, true);
});
test('housing story separates partial coverage, missing data, and no-growth municipalities', () => {
  const colors = {positive: '#112233', negative: '#445566', unknown: '#778899', partial: '#cf9a35',
    gain: '#399b55', neutral: '#e2e6e3', villageArea: '#bedde4', villageCenter: '#7bb6c5',
    plannedGrowth: '#38889f', downtown: '#15566b'};
  const statuses = ['all', 'some', 'none', 'no_housing', 'unknown'];
  const municipalities = statuses.map(status => ({geoid: status, status, block_count: status === 'no_housing' ? 0 : 3}));
  const story = MapStories.create({housingData: {municipalities}, colors});
  const initial = municipalities.map(props => ({kind: 'town', props,
    style: {fillColor: '#000000', fillOpacity: 0}}));
  const timeline = compile(initial, story.groups);
  assert.deepEqual(timeline.sample(timeline.stops[3]).map(i => i.style.fillColor),
    [colors.gain, colors.partial, colors.negative, colors.neutral, colors.unknown]);
  assert.deepEqual(story.steps[1].stats[0].select({geoid: 'unknown'}), true);
  assert.deepEqual(story.steps[1].stats[0].select({geoid: 'no_housing'}), false);
  // Opening and overlap chapters count Housing Growth Areas, not municipalities.
  assert.deepEqual(story.steps.map(s => s.statsOf || 'municipalities'), ['areas', 'municipalities', 'areas', 'municipalities']);
  const areas = ['substantial', 'partial', 'none', 'none'].map(coverage_status => ({coverage_status}));
  assert.deepEqual(story.steps[0].stats.map(s => areas.filter(s.select).length), [4]);
  assert.deepEqual(story.steps[2].stats.map(s => areas.filter(s.select).length), [1, 1, 2]);
  assert.deepEqual(story.steps[3].stats.map(s => municipalities.filter(s.select).length), [1, 1, 1, 1, 1]);
  assert.deepEqual(story.steps[3].stats.map(s => s.color),
    [colors.gain, colors.partial, colors.negative, colors.neutral, colors.unknown]);
  // Legend swatches and municipal hover appear only where municipalities are filled.
  assert.deepEqual(story.steps.map(s => !!s.municipalFill), [false, true, false, true]);
  assert.deepEqual(story.steps.map(s => s.stats.some(stat => stat.color)), [false, true, false, true]);
  const blocks = ['covered', 'uncovered', 'unknown'].map(coverage_kind => ({kind: 'housing-coverage',
    props: {coverage_kind, coverage_status: 'partial'}, style: {color: '#000000', fillColor: '#000000', opacity: 0, fillOpacity: 0}}));
  const blockTimeline = compile(blocks, story.groups);
  assert.deepEqual(blockTimeline.sample(blockTimeline.stops[2]).map(i => i.style.fillColor),
    [colors.gain, colors.negative, colors.unknown]);
  assert.deepEqual(blockTimeline.sample(blockTimeline.stops[2]).map(i => i.style.color),
    [colors.gain, colors.negative, colors.unknown]);
  assert.equal(story.steps[2].areaKey.some(([color]) => color === colors.partial), false);
  assert.equal(story.steps[3].areaKey.some(([color]) => color === colors.partial), false);
  assert.deepEqual(blockTimeline.sample(0).map(i => i.style.opacity), [0, 0, 0]);
});
test('opening housing layer preserves all four ordered category shades', () => {
  const colors = {villageArea: '#bedde4', villageCenter: '#7bb6c5', plannedGrowth: '#38889f', downtown: '#15566b'};
  const story = MapStories.create({housingData: {municipalities: []}, colors});
  assert.deepEqual(['VA', 'VC', 'PGA', 'DC'].map(flu_code => story.initial({kind: 'housing-category', props: {flu_code}}).fillColor),
    [colors.villageArea, colors.villageCenter, colors.plannedGrowth, colors.downtown]);
  assert.deepEqual(story.initial({kind: 'area', props: {}}), {});
});
test('binary growth chapter uses included block counts before revealing Tier coverage', () => {
  const colors = {positive: '#112233', negative: '#445566', unknown: '#778899', partial: '#cf9a35',
    gain: '#399b55', neutral: '#e2e6e3', villageArea: '#bedde4', villageCenter: '#7bb6c5',
    plannedGrowth: '#38889f', downtown: '#15566b'};
  const municipalities = [{geoid: 'with', block_count: 3, status: 'none'},
    {geoid: 'without', block_count: 0, status: 'no_housing'}];
  const story = MapStories.create({housingData: {municipalities}, colors});
  const initial = municipalities.map(props => ({kind: 'town', props,
    style: {fillColor: '#000000', fillOpacity: 0}}));
  const timeline = compile(initial, story.groups);
  assert.deepEqual(timeline.sample(timeline.stops[1]).map(i => i.style.fillColor), [colors.gain, colors.negative]);
  assert.deepEqual(story.steps[1].stats.map(s => s.color), [colors.gain, colors.negative]);
  assert.deepEqual(story.steps[1].stats.map(s => municipalities.filter(s.select).length), [1, 1]);
  assert.deepEqual(story.steps.map(s => s.municipalityView), ['growth', 'growth', 'coverage', 'coverage']);
  assert.deepEqual(timeline.sample(timeline.stops[2]).map(i => i.style.fillOpacity), [0, 0]);
  assert.deepEqual(timeline.sample(timeline.stops[3]).map(i => i.style.fillColor), [colors.negative, colors.neutral]);
  assert.deepEqual(timeline.sample(timeline.stops[1]).map(i => i.style.fillColor), [colors.gain, colors.negative]);
  assert.deepEqual(story.initial({kind: 'housing-context', props: {flu_code: 'PGA'}}), {});
});
test('unknown legend entries follow actual data and excluded audit fragments never become legend entries', () => {
  const colors = {positive: '#112233', negative: '#445566', unknown: '#778899', partial: '#cf9a35',
    gain: '#399b55', neutral: '#e2e6e3'};
  const known = {municipalities: [{geoid: 'known', block_count: 1, status: 'all'}],
    coverage_parts: {features: [{properties: {coverage_kind: 'covered'}}]}, context_fragments: {features: [{}]}};
  const story = MapStories.create({housingData: known, colors});
  assert.equal(story.steps[2].areaKey.some(([,label]) => label === 'Cannot assess'), false);
  assert.equal(story.steps[3].stats.some(({label}) => label === 'Cannot assess'), false);
  assert.equal(story.steps.some(s => [...s.areaKey.map(([, label]) => label), ...s.stats.map(stat => stat.label)].some(label => /context|excluded/i.test(label))), false);
  const future = MapStories.create({housingData: {municipalities: [{geoid: 'unknown', status: 'unknown'}],
    coverage_parts: {features: [{properties: {coverage_kind: 'unknown'}}]}}, colors});
  assert.equal(future.steps[2].areaKey.some(([,label]) => label === 'Cannot assess'), true);
  assert.equal(future.steps[3].stats.some(({label}) => label === 'Cannot assess'), true);
  assert.equal(story.steps[2].stats.some(({label}) => label === 'Cannot assess'), false);
  const unknownBlocks = MapStories.create({housingData: {...known, blocks: {features: [{properties: {coverage_status: 'unknown'}}]}}, colors});
  assert.equal(unknownBlocks.steps[2].stats.some(({label}) => label === 'Cannot assess'), true);
  assert.equal(future.steps[1].stats[1].select({geoid: 'unknown'}), false);
  assert.equal(future.steps[1].stats[2].select({geoid: 'unknown'}), true);
  assert.equal(story.steps[1].stats.length, 2);
  const unknownTown = {kind: 'town', props: {geoid: 'unknown'}, style: {fillColor: '#000000', fillOpacity: 0}};
  const timeline = compile([unknownTown], future.groups);
  assert.equal(timeline.sample(timeline.stops[1])[0].style.fillColor, colors.unknown);
});
test('progress follows the rendered map across unequal chapter lengths and reversals', () => {
  const chapter = position => MapStoryAnimation.chapterAt(position, [0, 4, 6.5]);
  for (const [position, expected] of [[0, 0], [2, .5], [4, 1], [5.25, 1.5], [6.5, 2], [2, .5], [-1, 0], [9, 2]]) {
    assert.equal(chapter(position), expected);
  }
});
test('scroll timeline holds near stops, samples transitions, and handles fast jumps and reversal', () => {
  const sample = value => MapStoryAnimation.scrollState(value, [0, 4, 6.5]);
  assert.equal(sample(-3).position, 0);
  assert.equal(sample(0.25).position, 0);
  assert.equal(sample(0.5).position, 0);
  assert.equal(sample(0.75).position, 2);
  assert.equal(sample(1).position, 4);
  assert.equal(sample(0.25).amount, 0);
  assert.equal(sample(0.5).amount, 1 / 3);
  assert.equal(sample(0.75).amount, 2 / 3);
  assert.equal(sample(2).amount, 1);
  assert.equal(sample(1.25).position, 4);
  assert.equal(sample(1.5).position, 4);
  assert.equal(sample(1.75).position, 5.25);
  assert.equal(sample(20).position, 6.5);
  assert.equal(sample(0.5).position, 0);
  assert.equal(sample(0).position, 0);
});

test('infrastructure uses three-valued OR without changing publisher status', () => {
  for (const a of [true, false, null]) for (const b of [true, false, null]) for (const c of [true, false, null]) {
    const area = {drinking_water:a, sewer_wastewater:b, adequate_soils:c, likely_eligible:false};
    const expected = [a,b,c].includes(true) ? true : [a,b,c].includes(null) ? null : false;
    assert.equal(display.infrastructure(area), expected);
    assert.equal(area.likely_eligible, false);
  }
});
test('only the development category omits separate zoning', () => {
  assert.equal(display.zoningApplies({category:'town_growth_development'}), false);
  for (const category of ['downtown_district','village_center_buffer',undefined]) {
    assert.equal(display.zoningApplies({category}), true);
  }
});

const initial = [{style: {opacity: 0, fillColor: '#000000'}}];
const timeline = () => compile(initial, [
  [() => ({opacity: 1}), () => ({fillColor: '#ffffff'}), () => ({opacity: 0.5})],
  [() => ({opacity: 0}), () => ({fillColor: '#000000'}), () => ({opacity: 1})],
]);
function harness(reduced = false, duration = timing.duration) {
  let time = 0, callback, id = 0, current;
  const controller = player(timeline(), (items, position) => {current = {items, position};}, {
    now: () => time, reduced: () => reduced, config: {...timing, duration},
    requestFrame: fn => {callback = fn; return ++id;},
    cancelFrame: () => {callback = null;},
  });
  return {go: controller.go, get current() {return current;},
    get pending() {return !!callback;},
    tick(ms) {time += ms; const fn = callback; callback = null; if (fn) fn(time);},
  };
}
test('three equal phases and half-length gaps produce exact endpoint and hold states', () => {
  const t = timeline();
  assert.deepEqual(t.stops, [0, 4, 8]);
  assert.equal(t.sample(0.5)[0].style.opacity, 0.5);
  assert.deepEqual(t.sample(1)[0].style, t.sample(1.4)[0].style);
  assert.equal(t.sample(2)[0].style.fillColor, '#808080');
  assert.deepEqual(t.sample(2.5)[0].style, t.sample(2.9)[0].style);
  assert.equal(t.sample(4)[0].style.opacity, 0.5);
});
test('reverse retraces phases and gaps at twice the forward speed', () => {
  const h = harness(); h.go(1); h.tick(3600);
  assert.equal(h.current.position, 4); assert.equal(h.pending, false);
  h.go(0); h.tick(225);
  assert.equal(h.current.position, 3.5);
  assert.deepEqual(h.current.items, timeline().sample(3.5));
  h.tick(1575); assert.equal(h.current.position, 0); assert.equal(h.pending, false);
});
test('rapid retargeting preserves the playhead and never applies a stale destination', () => {
  const h = harness(); h.go(1); h.tick(1800);
  const before = h.current; h.go(0); assert.deepEqual(h.current, before);
  h.tick(225); assert.equal(h.current.position, 1.5);
  h.go(2); h.tick(450); assert.equal(h.current.position, 2);
  h.go(0); h.tick(900); assert.equal(h.current.position, 0);
  h.tick(10000); assert.equal(h.current.position, 0); assert.equal(h.pending, false);
});
test('changing duration scales phases, gaps and reverse playback together', () => {
  const h = harness(false, 1800); h.go(2); h.tick(14400);
  assert.equal(h.current.position, 8);
  h.go(0); h.tick(7200); assert.equal(h.current.position, 0);
});
test('reduced motion goes directly to the requested chapter', () => {
  const h = harness(true); h.go(2); assert.equal(h.current.position, 8);
  h.go(0); assert.equal(h.current.position, 0); assert.equal(h.pending, false);
});

const summary = document.getElementById('summary');
summary.textContent = `${passed} passed, ${failed} failed`;
summary.className = failed ? 'fail' : 'pass';
</script>
